name: CI

# Every pull request (and every push to main) is formatted, linted,
# type-checked, unit-tested, built, and the build is tested in Chrome.
# Nothing is uploaded; deploy.yml does that for main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      # astro check (types) + astro build
      - name: Build
        run: npm run build

      - name: Version CSS/JS links
        run: python3 tools/cache_bust.py dist

      - name: Test the built site (links, files, cache-busting)
        run: npm run test:dist

      # uses the runner's preinstalled Google Chrome (channel "chrome")
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # handy for checking that unchanged files keep the version (and so the
      # browser-cached copy) they have on the live site
      - name: List CSS/JS versions
        run: grep -oh 'assets/[^"]*?v=[0-9a-f]*' dist/*.html | sort -u

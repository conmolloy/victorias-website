name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# never run two deploys at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Records each deploy on GitHub (Deployments): the editing screen (/admin)
    # reads it to show whether the latest save is live yet
    environment:
      name: production
      url: https://victoriaadler.co.uk
    env:
      HOST: ${{ secrets.CLOUDWAYS_HOST }}
      USER: ${{ secrets.CLOUDWAYS_USER }}
      REMOTE_PATH: ${{ secrets.CLOUDWAYS_PATH }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Videos added in the editing screen (/admin) have no preview image
      # yet: download any that are missing (tools/video_facades.py)
      - name: Video preview images
        run: |
          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python tools/video_facades.py --apply

      # Type-checks, then builds src/pages/*.astro + public/ into dist/
      - name: Build site (Astro)
        run: npm run build

      # Browsers keep CSS/JS for 30 days: every link must be versioned by its
      # content so returning visitors get changed files. The Astro build
      # already does this (src/lib/asset.ts); this re-checks the built HTML
      # (see tools/cache_bust.py) and fixes any link added without v().
      - name: Version CSS/JS links
        run: python3 tools/cache_bust.py dist

      # last safety net before going live: no missing files / wrong-case
      # names / stale ?v= hashes (the full checks run in ci.yml on every PR)
      - name: Test the built site
        run: npm test && npm run test:dist

      # Uploads the built site (dist/) only. No --delete: some media lives only
      # on the server, so files missing from the build must be left alone.
      - name: Upload site
        run: |
          rsync -avz \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.vscode/' \
            --exclude='*.md' \
            --exclude='tools/' \
            --exclude='perf/' \
            dist/ "$USER@$HOST:$REMOTE_PATH/"
